name: Build CV

on:
  push:
    branches: [main]
    paths: ["**.tex"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: Abdelrahman_Awad_CV.tex

      # Commits made with GITHUB_TOKEN don't retrigger workflows, so this can't loop.
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Abdelrahman_Awad_CV.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Build CV PDF from ${GITHUB_SHA::7}"
          git push
